[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-trends-audio-digest"
version = "0.1.0"
description = "Agente de IA que gera diariamente um digest em áudio das tendências de tecnologia e envia para o Discord via webhook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "willi" }]
keywords = ["ai", "podcast", "tts", "news", "discord", "audio"]
dependencies = [
    "groq>=0.9.0",
    "edge-tts>=6.1.9",
    "gTTS>=2.5.0",
    "requests>=2.31.0",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
tech-trends = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]