name: Daily - Digest para o Discord

on:
  schedule:
    # Cron em UTC. 11:00 UTC = 08:00 (Brasília, UTC-3). Ajuste conforme necessário.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-send:
    name: Gerar áudio e enviar ao Discord
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar pipeline + enviar ao Discord
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
          TTS_RATE: ${{ secrets.TTS_RATE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py --count 6 --send-discord